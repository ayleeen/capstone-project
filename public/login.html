<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="form-container">
    <img src="./image/lolaysLogo.jpg" alt="" style="display: block; margin: 0 auto 20px; height: 80px;">
    <h2>Log In</h2>
    <form method="POST">
      <input type="text" placeholder="Email" name="email" required>
      <div class="input-group">
        <input type="password" placeholder="Password" name="password" id="password" required>
        <i class="fa-solid fa-eye-slash passicon" id="pass-icon" onclick="togglePassword()"></i>
      </div>

      <button type="submit">Log In</button>
      <p>Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </div>
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const passIcon = document.getElementById("pass-icon");

      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";

      passIcon.classList.toggle("fa-eye");
      passIcon.classList.toggle("fa-eye-slash");
    }
  </script>
</body>
</html>
